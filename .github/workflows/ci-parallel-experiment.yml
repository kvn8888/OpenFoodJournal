name: CI Parallel Experiment

on:
  push:
    branches: [codex/ci-speed-parallel]
    paths:
      - .github/workflows/ci-parallel-experiment.yml
      - .github/scripts/benchmark-ci.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-parallel-experiment-${{ github.ref }}
  cancel-in-progress: true

# Validation only. No protected environments, provider keys, signing, uploads,
# or release mutations. The sequential control uses identical app/test code.
jobs:
  device-build:
    name: Parallel device (${{ matrix.repetition }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BENCHMARK_REPETITION: ${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/verify-xcode.sh
      - run: python3 .github/scripts/benchmark-ci.py parallel-device
      - name: Retain small benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallel-device-${{ matrix.repetition }}
          path: ${{ runner.temp }}/ci-benchmark
          retention-days: 3

  simulator-tests:
    name: Parallel simulator (${{ matrix.repetition }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BENCHMARK_REPETITION: ${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/verify-xcode.sh
      - run: python3 .github/scripts/benchmark-ci.py parallel-simulator
      - name: Retain small benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallel-simulator-${{ matrix.repetition }}
          path: ${{ runner.temp }}/ci-benchmark
          retention-days: 3

  sequential-control:
    name: Sequential control (${{ matrix.repetition }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BENCHMARK_REPETITION: ${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/verify-xcode.sh
      - run: python3 .github/scripts/benchmark-ci.py early-boot-reuse
      - name: Retain small benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sequential-control-${{ matrix.repetition }}
          path: ${{ runner.temp }}/ci-benchmark
          retention-days: 3

  parallel-checks-passed:
    name: Require both parallel checks
    needs: [device-build, simulator-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DEVICE_RESULT: ${{ needs.device-build.result }}
      SIMULATOR_RESULT: ${{ needs.simulator-tests.result }}
    steps:
      - name: Verify both branches succeeded without deploying
        run: |
          test "${DEVICE_RESULT}" = success
          test "${SIMULATOR_RESULT}" = success
          echo "Device checks and simulator tests passed. This benchmark never deploys."
