name: Hosted build timing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-build:
    name: Clean iOS device build (Xcode 27.2)
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the Xcode Cloud source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 80caf34e6d43415eaf7c33602ffa6a27ecd1e83e
          persist-credentials: false
      - name: Verify toolchain and source
        run: |
          [[ "$(git rev-parse HEAD)" == '80caf34e6d43415eaf7c33602ffa6a27ecd1e83e' ]]
          [[ "$(xcodebuild -version)" == $'Xcode 27.2\nBuild version 27B52' ]]
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Time a clean device build
        shell: bash
        run: |
          /usr/bin/time -p xcodebuild \
            -project OpenFoodJournal.xcodeproj \
            -scheme OpenFoodJournal \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HostedBuildTiming" \
            -resultBundlePath "$RUNNER_TEMP/HostedBuildTiming.xcresult" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/hosted-build-timing.log"
          /usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$RUNNER_TEMP/HostedBuildTiming/Build/Products/Debug-iphoneos/OpenFoodJournal.app/Info.plist"
          grep '^real ' "$RUNNER_TEMP/hosted-build-timing.log" >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get build-results --path "$RUNNER_TEMP/HostedBuildTiming.xcresult" | jq -c '{status,startTime,endTime,buildSeconds:(.endTime - .startTime)}' | tee -a "$GITHUB_STEP_SUMMARY"
