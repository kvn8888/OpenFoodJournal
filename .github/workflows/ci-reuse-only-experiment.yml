name: CI Reuse Only Experiment

on:
  push:
    branches: [codex/ci-speed-reuse-only]
    paths:
      - .github/workflows/ci-reuse-only-experiment.yml
      - .github/scripts/benchmark-ci.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-reuse-only-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-only:
    name: Reuse without early boot (${{ matrix.repetition }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BENCHMARK_REPETITION: ${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/verify-xcode.sh
      - run: python3 .github/scripts/benchmark-ci.py reuse-only
      - name: Retain small benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reuse-only-${{ matrix.repetition }}
          path: ${{ runner.temp }}/ci-benchmark
          retention-days: 3
