name: Release Credential Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-store-connect:
    name: App Store Connect (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment:
          - testflight-internal
          - app-store-production
    runs-on: macos-26
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}

    steps:
      - name: Check out release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned App Store Connect CLI
        run: bash .github/scripts/install-asc.sh

      - name: Verify credentials and app access
        run: |
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}"
          : "${ASC_PRIVATE_KEY_B64:?Missing ASC_PRIVATE_KEY_B64}"

          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          asc apps view --id "${app_id}" --output json > "${RUNNER_TEMP}/app.json"
          asc builds list --app "${app_id}" --output json > "${RUNNER_TEMP}/builds.json"

          resolved_app_id="$(
            jq -r '.data.id // .id // empty' "${RUNNER_TEMP}/app.json"
          )"
          if [[ "${resolved_app_id}" != "${app_id}" ]]; then
            echo "The credential did not resolve the configured app ID." >&2
            exit 1
          fi

          {
            echo "### ${{ matrix.environment }}"
            echo
            echo "- App Store Connect authentication: passed"
            echo "- Configured app access: passed"
            echo "- Build-list read access: passed"
          } >> "${GITHUB_STEP_SUMMARY}"

  testflight-certificate:
    name: TestFlight distribution certificate
    runs-on: macos-26
    timeout-minutes: 10
    environment: testflight-internal
    env:
      APPLE_DISTRIBUTION_CERTIFICATE_B64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_B64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out certificate configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode certificate and verify password and identity
        run: |
          : "${APPLE_DISTRIBUTION_CERTIFICATE_B64:?Missing APPLE_DISTRIBUTION_CERTIFICATE_B64}"
          : "${APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD:?Missing APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD}"

          signing_root="${RUNNER_TEMP}/openfoodjournal-certificate-check"
          certificate_path="${signing_root}/distribution.p12"
          keychain_path="${signing_root}/check.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          signing_name="$(jq -r '.signingCertificateName' ci/release-config.json)"
          mkdir -p "${signing_root}"
          printf '%s' "${APPLE_DISTRIBUTION_CERTIFICATE_B64}" \
            | /usr/bin/base64 -D > "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -A \
            -f pkcs12 \
            -k "${keychain_path}"

          identity_output="$(security find-identity -v -p codesigning "${keychain_path}")"
          if ! grep -Fq "${signing_name}" <<< "${identity_output}"; then
            echo "The imported certificate does not contain the configured signing identity." >&2
            exit 1
          fi

          {
            echo "### testflight-internal certificate"
            echo
            echo "- Certificate decode: passed"
            echo "- Certificate password: passed"
            echo "- Codesigning identity: passed"
          } >> "${GITHUB_STEP_SUMMARY}"

  testflight-profile:
    name: TestFlight provisioning profile
    runs-on: macos-26
    timeout-minutes: 10
    environment: testflight-internal
    env:
      APPLE_PROVISIONING_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}

    steps:
      - name: Check out profile configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode and verify provisioning profile
        run: |
          : "${APPLE_PROVISIONING_PROFILE_B64:?Missing APPLE_PROVISIONING_PROFILE_B64}"

          signing_root="${RUNNER_TEMP}/openfoodjournal-profile-check"
          profile_path="${signing_root}/distribution.mobileprovision"
          profile_plist="${signing_root}/distribution.plist"
          bundle_id="$(jq -r '.bundleIdentifier' ci/release-config.json)"
          team_id="$(jq -r '.teamID' ci/release-config.json)"
          mkdir -p "${signing_root}"
          printf '%s' "${APPLE_PROVISIONING_PROFILE_B64}" \
            | /usr/bin/base64 -D > "${profile_path}"
          security cms -D -i "${profile_path}" > "${profile_plist}"

          profile_app_id="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "${profile_plist}"
          )"
          profile_team_id="$(
            /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${profile_plist}"
          )"
          if [[ "${profile_app_id}" != "${team_id}.${bundle_id}" ]]; then
            echo "The provisioning profile does not match the configured app identifier." >&2
            exit 1
          fi
          if [[ "${profile_team_id}" != "${team_id}" ]]; then
            echo "The provisioning profile does not match the configured Apple team." >&2
            exit 1
          fi

          profile_expiration="$(
            plutil -extract ExpirationDate raw -o - "${profile_plist}"
          )"
          if ! ruby -rtime -e 'exit(Time.parse(ARGV[0]).utc > Time.now.utc ? 0 : 1)' \
            "${profile_expiration}"; then
            echo "The provisioning profile is expired." >&2
            exit 1
          fi

          {
            echo "### testflight-internal provisioning profile"
            echo
            echo "- Provisioning profile decode: passed"
            echo "- Bundle ID and team match: passed"
            echo "- Provisioning profile expiration: passed"
          } >> "${GITHUB_STEP_SUMMARY}"
