name: App Store Promotion

on:
  push:
    branches:
      - app-store
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: Submit the staged production RC build to App Review after strict validation
        required: true
        default: false
        type: boolean
      distribute_prod_testflight:
        description: Also distribute a newly built production RC to the production internal TestFlight group
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: openfoodjournal-app-store-promotion
  cancel-in-progress: false

jobs:
  cloud-ci:
    name: Validate branch
    uses: ./.github/workflows/cloud-ci.yml

  prepare:
    name: Prepare reviewed promotion plan
    needs: cloud-ci
    if: vars.ENABLE_APP_STORE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    outputs:
      preview_tag: ${{ steps.promotion.outputs.preview_tag }}
      preview_build_number: ${{ steps.promotion.outputs.preview_build_number }}
      reuse_existing_rc: ${{ steps.promotion.outputs.reuse_existing_rc }}
      rc_tag: ${{ steps.promotion.outputs.rc_tag }}
      prod_build_id: ${{ steps.promotion.outputs.prod_build_id }}
      prod_build_number: ${{ steps.promotion.outputs.prod_build_number }}
      version: ${{ steps.promotion.outputs.version }}
      store_metadata_source: ${{ steps.store_metadata.outputs.source }}

    steps:
      - name: Check out App Store source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve UAT-tested Preview manifest and any existing production RC
        id: promotion
        run: |
          preview_prefix="$(jq -r '.preview.tagPrefix' ci/release-config.json)"
          rc_prefix="$(jq -r '.releaseCandidateTagPrefix' ci/release-config.json)"

          preview_tag="$(
            git tag --merged HEAD --list "${preview_prefix}*" --sort=-creatordate |
              head -n 1
          )"
          if [[ -z "${preview_tag}" ]]; then
            echo "No UAT-tested Preview prerelease (${preview_prefix}*) is reachable from app-store HEAD." >&2
            exit 1
          fi

          manifest_dir="${RUNNER_TEMP}/promotion-manifest"
          mkdir -p "${manifest_dir}"
          gh release download "${preview_tag}" \
            --pattern 'release-manifest.json' \
            --pattern 'whats-new.txt' \
            --pattern 'what-to-test.txt' \
            --pattern 'release-notes-metadata.json' \
            --dir "${manifest_dir}"
          manifest_path="${manifest_dir}/release-manifest.json"
          whats_new_path="${manifest_dir}/whats-new.txt"
          bash .github/scripts/verify-promotion.sh \
            --kind preview-uat \
            "${preview_tag}" \
            "${manifest_path}" \
            "${whats_new_path}"

          version="$(jq -r '.version' "${manifest_path}")"
          preview_build_number="$(jq -r '.buildNumber' "${manifest_path}")"

          reuse_existing_rc="false"
          rc_tag=""
          prod_build_id=""
          prod_build_number=""

          candidate_rc_tag="$(
            git tag --merged HEAD --list "${rc_prefix}*" --sort=-creatordate |
              head -n 1
          )"
          if [[ -n "${candidate_rc_tag}" ]]; then
            rc_dir="${RUNNER_TEMP}/rc-check"
            mkdir -p "${rc_dir}"
            if gh release download "${candidate_rc_tag}" \
              --pattern 'release-manifest.json' \
              --dir "${rc_dir}" 2>/dev/null
            then
              rc_source_preview="$(jq -r '.sourcePreviewTag // empty' "${rc_dir}/release-manifest.json")"
              if [[ "${rc_source_preview}" == "${preview_tag}" ]] && \
                bash .github/scripts/verify-promotion.sh \
                  --kind production-rc \
                  "${candidate_rc_tag}" \
                  "${rc_dir}/release-manifest.json" \
                  "${whats_new_path}" >/dev/null 2>&1
              then
                cp "${rc_dir}/release-manifest.json" "${manifest_dir}/prod-rc-manifest.json"
                reuse_existing_rc="true"
                rc_tag="${candidate_rc_tag}"
                prod_build_id="$(jq -r '.buildID' "${manifest_dir}/prod-rc-manifest.json")"
                prod_build_number="$(jq -r '.buildNumber' "${manifest_dir}/prod-rc-manifest.json")"
              fi
            fi
          fi

          if [[ "${{ inputs.submit_for_review }}" == "true" && "${reuse_existing_rc}" != "true" ]]; then
            echo "Cannot submit directly to App Review before a production RC build has been staged for ${preview_tag}." >&2
            echo "Run staging first (push to app-store or dispatch with submit_for_review=false)." >&2
            exit 1
          fi

          printf 'preview_tag=%s\n' "${preview_tag}" >> "${GITHUB_OUTPUT}"
          printf 'preview_build_number=%s\n' "${preview_build_number}" >> "${GITHUB_OUTPUT}"
          printf 'reuse_existing_rc=%s\n' "${reuse_existing_rc}" >> "${GITHUB_OUTPUT}"
          printf 'rc_tag=%s\n' "${rc_tag}" >> "${GITHUB_OUTPUT}"
          printf 'prod_build_id=%s\n' "${prod_build_id}" >> "${GITHUB_OUTPUT}"
          printf 'prod_build_number=%s\n' "${prod_build_number}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Collect product-page evidence
        run: |
          locale="$(jq -r '.primaryLocale' ci/release-config.json)"

          # The reviewed What's New already describes this release in
          # user-facing terms and was validated before the Preview tag was
          # cut, so it is the evidence of record for the rest of the page.
          cp "${RUNNER_TEMP}/promotion-manifest/whats-new.txt" \
            "${RUNNER_TEMP}/store-evidence.txt"

          # `asc metadata pull` writes this tree. Without a committed snapshot
          # the generator writes fresh copy rather than editing what is live,
          # so the approval summary calls that case out explicitly.
          : > "${RUNNER_TEMP}/store-current-description.txt"
          current="metadata/version/${{ steps.promotion.outputs.version }}/${locale}.json"
          if [[ ! -f "${current}" ]]; then
            latest="$(ls -1d metadata/version/*/ 2>/dev/null | sort -V | tail -n 1)"
            [[ -n "${latest}" ]] && current="${latest}${locale}.json"
          fi
          if [[ -f "${current}" ]]; then
            jq -r '.description // ""' "${current}" \
              > "${RUNNER_TEMP}/store-current-description.txt"
          fi

      - name: Draft product-page copy with the agentic harness
        if: env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@cf44f7fa4886f7aea5dae9774caef8ae6ccebf81 # v1.0.211
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Grep,Glob,Write"'
          prompt: |
            Write the App Store product page copy for OpenFoodJournal ${{ steps.promotion.outputs.version }}.

            Read these first, in order:
              1. ci/prompts/store-metadata-system.txt - the rules you must follow
              2. ${{ runner.temp }}/store-evidence.txt - what actually ships in this version
              3. ${{ runner.temp }}/store-current-description.txt - the current page, may be empty
              4. The repository itself, to check that every claim you make is supported by code

            You have the repository, so verify rather than assume: if you want to
            claim a capability, find it in the source first. Drop any claim you
            cannot ground. Do not describe anything gated behind a Debug or Preview build.

            Write the result to ${{ runner.temp }}/store-metadata.agent.json as a
            single JSON object with exactly the keys description, keywords and
            promotionalText, obeying every limit in the rules file. Write nothing
            else, create no branch, and open no pull request.

      - name: Resolve App Store product-page copy
        id: store_metadata
        env:
          BIFROST_BASE_URL: ${{ vars.BIFROST_BASE_URL }}
          BIFROST_VIRTUAL_KEY: ${{ secrets.BIFROST_VIRTUAL_KEY }}
          BIFROST_AUTHORIZATION: ${{ secrets.BIFROST_AUTHORIZATION }}
          STORE_METADATA_AGENT_MODEL: ${{ vars.STORE_METADATA_AGENT_MODEL }}
        run: |
          model="${{ vars.STORE_METADATA_MODEL }}"
          if [[ -z "${model}" ]]; then
            model="$(jq -r '.storeMetadataModel' ci/release-config.json)"
          fi

          bash .github/scripts/generate-store-metadata.sh \
            "${{ steps.promotion.outputs.version }}" \
            "$(jq -r '.primaryLocale' ci/release-config.json)" \
            "${RUNNER_TEMP}/store-evidence.txt" \
            "${RUNNER_TEMP}/store-current-description.txt" \
            "${RUNNER_TEMP}/store-metadata.agent.json" \
            "${RUNNER_TEMP}/promotion-manifest/store-metadata.json" \
            "${RUNNER_TEMP}/promotion-manifest/store-metadata-source.json" \
            "${model}" >> "${GITHUB_OUTPUT}"

      - name: Retain the immutable promotion plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-promotion-plan
          path: ${{ runner.temp }}/promotion-manifest
          retention-days: 14

      - name: Write approval summary
        run: |
          manifest="${RUNNER_TEMP}/promotion-manifest/release-manifest.json"
          {
            echo "## App Store promotion awaiting approval"
            echo
            echo "- Version: ${{ steps.promotion.outputs.version }}"
            echo "- Verified Preview UAT manifest: \`${{ steps.promotion.outputs.preview_tag }}\` (Preview build ${{ steps.promotion.outputs.preview_build_number }})"
            if [[ "${{ steps.promotion.outputs.reuse_existing_rc }}" == "true" ]]; then
              echo "- Production binary: reuse staged \`${{ steps.promotion.outputs.rc_tag }}\` (prod build ${{ steps.promotion.outputs.prod_build_number }}); no rebuild"
            else
              echo "- Production binary: archive \`Release\` (\`k3vnc.OpenFoodJournal\`) once from this UAT-verified commit"
              echo "- Also distribute prod RC to internal TestFlight: ${{ inputs.distribute_prod_testflight == true && 'yes' || 'no' }}"
            fi
            echo "- Requested action: ${{ inputs.submit_for_review == true && 'validate and submit staged build to App Review' || 'stage and validate only' }}"
            echo "- Release-note source: \`$(jq -r '.releaseNotes.source' "${manifest}")\`"
            echo "- Product-page source: \`${{ steps.store_metadata.outputs.source }}\`"
            echo
            store="${RUNNER_TEMP}/promotion-manifest/store-metadata.json"
            if [[ -s "${store}" ]]; then
              if [[ ! -s "${RUNNER_TEMP}/store-current-description.txt" ]]; then
                echo "> No committed \`metadata/\` snapshot was available, so this copy"
                echo "> was written fresh rather than edited from the live page."
                echo
              fi
              echo "### Proposed product page (${{ steps.promotion.outputs.version }})"
              echo
              echo "**Promotional text**"
              echo
              jq -r '.promotionalText' "${store}"
              echo
              echo "**Keywords**"
              echo
              printf '\`%s\`\n' "$(jq -r '.keywords' "${store}")"
              echo
              echo "**Description**"
              echo
              jq -r '.description' "${store}"
              echo
            else
              echo "### Product page"
              echo
              echo "No copy was generated; the live App Store text is kept as-is."
              echo
            fi
            echo "### Reviewed What's New (${{ steps.promotion.outputs.version }})"
            echo
            cat "${RUNNER_TEMP}/promotion-manifest/whats-new.txt"
            echo
            echo
            echo "Approve the protected \`app-store-production\` environment only if this exact UAT-verified commit and text are ready for production."
          } >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Build or promote production release
    needs:
      - cloud-ci
      - prepare
    if: vars.ENABLE_APP_STORE_AUTOMATION == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: app-store-production
    permissions:
      contents: write

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_B64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_B64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out approved App Store source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download approved promotion plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-store-promotion-plan
          path: ${{ runner.temp }}/promotion-manifest

      - name: Reverify approved Preview UAT provenance and notes
        run: |
          bash .github/scripts/verify-promotion.sh \
            --kind preview-uat \
            "${{ needs.prepare.outputs.preview_tag }}" \
            "${RUNNER_TEMP}/promotion-manifest/release-manifest.json" \
            "${RUNNER_TEMP}/promotion-manifest/whats-new.txt"

      - name: Reverify existing production RC manifest when reusing
        if: needs.prepare.outputs.reuse_existing_rc == 'true'
        run: |
          bash .github/scripts/verify-promotion.sh \
            --kind production-rc \
            "${{ needs.prepare.outputs.rc_tag }}" \
            "${RUNNER_TEMP}/promotion-manifest/prod-rc-manifest.json" \
            "${RUNNER_TEMP}/promotion-manifest/whats-new.txt"

      - name: Reverify approved product-page copy
        run: |
          store="${RUNNER_TEMP}/promotion-manifest/store-metadata.json"
          if [[ -s "${store}" ]]; then
            bash .github/scripts/validate-store-metadata.sh "${store}"
          else
            echo "No generated product-page copy in the approved plan; keeping the live text."
          fi

      - name: Verify pinned Xcode toolchain
        run: bash .github/scripts/verify-xcode.sh

      - name: Install pinned App Store Connect CLI
        run: bash .github/scripts/install-asc.sh

      - name: Install production distribution signing assets
        if: needs.prepare.outputs.reuse_existing_rc != 'true'
        run: bash .github/scripts/install-signing-assets.sh

      - name: Build, verify, and upload production Release binary once
        id: build_rc
        if: needs.prepare.outputs.reuse_existing_rc != 'true'
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          bundle_id="$(jq -r '.bundleIdentifier' ci/release-config.json)"
          cloudkit="$(jq -r '.cloudKitContainerIdentifier' ci/release-config.json)"
          display_name="$(jq -r '.displayName' ci/release-config.json)"
          team_id="$(jq -r '.teamID' ci/release-config.json)"
          signing_certificate="$(jq -r '.signingCertificateName' ci/release-config.json)"
          rc_prefix="$(jq -r '.releaseCandidateTagPrefix' ci/release-config.json)"
          version="${{ needs.prepare.outputs.version }}"
          locale="$(jq -r '.primaryLocale' "${RUNNER_TEMP}/promotion-manifest/release-manifest.json")"

          asc apps view --id "${app_id}" --output json > "${RUNNER_TEMP}/prod-app.json"
          resolved_bundle_id="$(jq -r '.data.attributes.bundleId // empty' "${RUNNER_TEMP}/prod-app.json")"
          if [[ "${resolved_bundle_id}" != "${bundle_id}" ]]; then
            echo "App Store Connect app ${app_id} has bundle ID ${resolved_bundle_id:-<missing>}, expected ${bundle_id}." >&2
            exit 1
          fi

          release_version="$(
            asc xcode version view \
              --project OpenFoodJournal.xcodeproj \
              --target OpenFoodJournal \
              --configuration Release \
              --output json | jq -r '.version'
          )"
          if [[ "${release_version}" != "${version}" ]]; then
            echo "Release MARKETING_VERSION (${release_version}) does not match Preview UAT version (${version})." >&2
            exit 1
          fi

          build_number="$(
            asc builds next-build-number \
              --app "${app_id}" \
              --version "${version}" \
              --platform IOS \
              --output json | jq -r '.nextBuildNumber'
          )"
          if [[ -z "${build_number}" || "${build_number}" == "null" ]]; then
            echo "Could not allocate a production build number for ${version}." >&2
            exit 1
          fi

          export_options="${RUNNER_TEMP}/ExportOptions.plist"
          cp ci/ExportOptions.plist "${export_options}"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:${bundle_id} string ${OFJ_PROFILE_NAME}" \
            "${export_options}"
          /usr/libexec/PlistBuddy \
            -c "Set :signingCertificate ${signing_certificate}" \
            "${export_options}"
          plutil -lint "${export_options}"

          asc xcode archive \
            --project OpenFoodJournal.xcodeproj \
            --scheme OpenFoodJournal \
            --configuration Release \
            --clean \
            --archive-path "${RUNNER_TEMP}/OpenFoodJournal.xcarchive" \
            --xcodebuild-flag=-destination \
            --xcodebuild-flag=generic/platform=iOS \
            --xcodebuild-flag="CODE_SIGN_STYLE=Manual" \
            --xcodebuild-flag="DEVELOPMENT_TEAM=${team_id}" \
            --xcodebuild-flag="CURRENT_PROJECT_VERSION=${build_number}" \
            --xcodebuild-flag="PROVISIONING_PROFILE_SPECIFIER=${OFJ_PROFILE_NAME}" \
            --xcodebuild-flag="CODE_SIGN_IDENTITY=${signing_certificate}" \
            --output json

          asc xcode export \
            --archive-path "${RUNNER_TEMP}/OpenFoodJournal.xcarchive" \
            --export-options "${export_options}" \
            --ipa-path "${RUNNER_TEMP}/OpenFoodJournal.ipa" \
            --timeout 20m \
            --output json

          bash .github/scripts/verify-signed-ipa.sh \
            "${RUNNER_TEMP}/OpenFoodJournal.ipa" \
            "${bundle_id}" \
            "${team_id}" \
            "${cloudkit}" \
            "${display_name}"

          if [[ "${{ inputs.distribute_prod_testflight }}" == "true" ]]; then
            prod_group="$(jq -r '.testFlightGroupID' ci/release-config.json)"
            asc publish testflight \
              --app "${app_id}" \
              --ipa "${RUNNER_TEMP}/OpenFoodJournal.ipa" \
              --group "${prod_group}" \
              --test-notes "$(cat "${RUNNER_TEMP}/promotion-manifest/what-to-test.txt")" \
              --locale "${locale}" \
              --wait \
              --timeout 45m \
              --output json \
              --pretty > "${RUNNER_TEMP}/prod-upload.json"
          else
            asc builds upload \
              --app "${app_id}" \
              --ipa "${RUNNER_TEMP}/OpenFoodJournal.ipa" \
              --wait \
              --output json \
              --pretty > "${RUNNER_TEMP}/prod-upload.json"
          fi

          build_id="$(
            asc builds list \
              --app "${app_id}" \
              --version "${version}" \
              --build-number "${build_number}" \
              --platform IOS \
              --processing-state VALID \
              --output json | jq -r '.data[0].id // empty'
          )"
          if [[ -z "${build_id}" ]]; then
            echo "The processed production build could not be resolved after upload." >&2
            exit 1
          fi

          ipa_sha="$(shasum -a 256 "${RUNNER_TEMP}/OpenFoodJournal.ipa" | awk '{print $1}')"
          preview_manifest="${RUNNER_TEMP}/promotion-manifest/release-manifest.json"
          rc_manifest="${RUNNER_TEMP}/promotion-manifest/prod-rc-manifest.json"
          jq -n \
            --arg sourcePreviewTag "${{ needs.prepare.outputs.preview_tag }}" \
            --arg appStoreAppID "${app_id}" \
            --arg bundleIdentifier "${bundle_id}" \
            --arg cloudKitContainerIdentifier "${cloudkit}" \
            --arg buildID "${build_id}" \
            --arg buildNumber "${build_number}" \
            --arg commitSHA "${GITHUB_SHA}" \
            --arg createdAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg ipaSHA256 "${ipa_sha}" \
            --arg xcodeBuild "$(jq -r '.requiredXcodeBuild' ci/release-config.json)" \
            --slurpfile preview "${preview_manifest}" \
            '{
              schemaVersion: 3,
              manifestKind: "production-rc",
              sourcePreviewTag: $sourcePreviewTag,
              appStoreAppID: $appStoreAppID,
              bundleIdentifier: $bundleIdentifier,
              cloudKitContainerIdentifier: $cloudKitContainerIdentifier,
              xcodeConfiguration: "Release",
              buildID: $buildID,
              buildNumber: $buildNumber,
              commitSHA: $commitSHA,
              createdAt: $createdAt,
              ipaSHA256: $ipaSHA256,
              primaryLocale: $preview[0].primaryLocale,
              whatToTest: $preview[0].whatToTest,
              whatsNew: $preview[0].whatsNew,
              whatsNewSHA256: $preview[0].whatsNewSHA256,
              releaseNotes: $preview[0].releaseNotes,
              version: $preview[0].version,
              xcodeBuild: $xcodeBuild
            }' > "${rc_manifest}"

          rc_tag="${rc_prefix}${version}-${build_number}"
          gh release create "${rc_tag}" \
            --target "${GITHUB_SHA}" \
            --title "Production RC ${version} (${build_number})" \
            --notes-file "${RUNNER_TEMP}/promotion-manifest/what-to-test.txt" \
            --prerelease \
            --draft
          gh release upload "${rc_tag}" \
            "${rc_manifest}#release-manifest.json" \
            "${RUNNER_TEMP}/promotion-manifest/what-to-test.txt#what-to-test.txt" \
            "${RUNNER_TEMP}/promotion-manifest/whats-new.txt#whats-new.txt" \
            "${RUNNER_TEMP}/promotion-manifest/release-notes-metadata.json#release-notes-metadata.json"
          gh release edit "${rc_tag}" \
            --draft=false \
            --prerelease

          printf 'build_id=%s\n' "${build_id}" >> "${GITHUB_OUTPUT}"
          printf 'build_number=%s\n' "${build_number}" >> "${GITHUB_OUTPUT}"
          printf 'rc_tag=%s\n' "${rc_tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve active production build identity
        id: active_build
        run: |
          if [[ "${{ needs.prepare.outputs.reuse_existing_rc }}" == "true" ]]; then
            build_id="${{ needs.prepare.outputs.prod_build_id }}"
            build_number="${{ needs.prepare.outputs.prod_build_number }}"
            rc_tag="${{ needs.prepare.outputs.rc_tag }}"
          else
            build_id="${{ steps.build_rc.outputs.build_id }}"
            build_number="${{ steps.build_rc.outputs.build_number }}"
            rc_tag="${{ steps.build_rc.outputs.rc_tag }}"
          fi
          printf 'build_id=%s\n' "${build_id}" >> "${GITHUB_OUTPUT}"
          printf 'build_number=%s\n' "${build_number}" >> "${GITHUB_OUTPUT}"
          printf 'rc_tag=%s\n' "${rc_tag}" >> "${GITHUB_OUTPUT}"

      - name: Confirm production build remains valid in App Store Connect
        run: |
          asc builds info \
            --build-id "${{ steps.active_build.outputs.build_id }}" \
            --output json \
            --pretty > "${RUNNER_TEMP}/build-info.json"
          processing_state="$(jq -r '.data.attributes.processingState // .attributes.processingState // empty' "${RUNNER_TEMP}/build-info.json")"
          if [[ "${processing_state}" != "VALID" ]]; then
            echo "Build processing state is ${processing_state:-unknown}, not VALID." >&2
            exit 1
          fi

      - name: Find the current public version
        id: public_version
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          versions_json="$(asc versions list --app "${app_id}" --platform IOS --output json)"
          source_version="$(
            jq -r '
              [
                .data[]
                | select(
                    .attributes.appStoreState == "READY_FOR_SALE"
                    or .attributes.appVersionState == "READY_FOR_DISTRIBUTION"
                  )
              ]
              | sort_by(.attributes.createdDate)
              | last
              | .attributes.versionString // empty
            ' <<< "${versions_json}"
          )"
          if [[ -z "${source_version}" ]]; then
            echo "No public App Store version is available as the metadata source." >&2
            exit 1
          fi
          printf 'version=%s\n' "${source_version}" >> "${GITHUB_OUTPUT}"

      - name: Stage production build for the App Store
        if: inputs.submit_for_review != true
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"

          # release stage performs its own readiness validation. Copy the
          # complete public localization as a temporary valid baseline so a
          # newly created version is not rejected for an empty What's New or
          # description before the next step pushes the reviewed manifest.
          asc release stage \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build "${{ steps.active_build.outputs.build_id }}" \
            --copy-metadata-from "${{ steps.public_version.outputs.version }}" \
            --checkpoint-file "${RUNNER_TEMP}/app-store-stage-checkpoint.json" \
            --confirm \
            --output json \
            --pretty > "${RUNNER_TEMP}/app-store-stage.json"

      - name: Apply reviewed release notes from the manifest
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          manifest="${RUNNER_TEMP}/promotion-manifest/release-manifest.json"
          locale="$(jq -r '.primaryLocale' "${manifest}")"
          metadata_dir="${RUNNER_TEMP}/metadata"
          metadata_file="${metadata_dir}/version/${{ needs.prepare.outputs.version }}/${locale}.json"
          mkdir -p "$(dirname "${metadata_file}")"
          store="${RUNNER_TEMP}/promotion-manifest/store-metadata.json"
          if [[ -s "${store}" ]]; then
            jq -s '{whatsNew: .[0].whatsNew} + .[1]' "${manifest}" "${store}" \
              > "${metadata_file}"
          else
            jq '{whatsNew: .whatsNew}' "${manifest}" > "${metadata_file}"
          fi
          asc metadata validate --dir "${metadata_dir}" --output json
          asc metadata push \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --platform IOS \
            --dir "${metadata_dir}" \
            --output json \
            --pretty > "${RUNNER_TEMP}/metadata-push.json"

      - name: Run strict submission readiness checks
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          asc validate \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --platform IOS \
            --strict \
            --output json \
            --pretty > "${RUNNER_TEMP}/app-store-validation.json"

      - name: Submit to App Review
        if: inputs.submit_for_review == true
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          asc review submit \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build "${{ steps.active_build.outputs.build_id }}" \
            --confirm \
            --output json \
            --pretty > "${RUNNER_TEMP}/app-review-submission.json"

      - name: Write promotion summary
        run: |
          {
            echo "## App Store promotion"
            echo
            echo "- Version: ${{ needs.prepare.outputs.version }}"
            echo "- Production build: ${{ steps.active_build.outputs.build_number }} (\`${{ steps.active_build.outputs.rc_tag }}\`)"
            echo "- Verified Preview UAT tag: \`${{ needs.prepare.outputs.preview_tag }}\`"
            echo "- Rebuilt on this run: ${{ needs.prepare.outputs.reuse_existing_rc == 'true' && 'no; exact staged production RC reused' || 'yes; archived Release once from UAT-verified commit' }}"
            echo "- Product-page source: \`${{ needs.prepare.outputs.store_metadata_source }}\`"
            echo "- Submitted for review: ${{ inputs.submit_for_review || false }}"
          } >> "${GITHUB_STEP_SUMMARY}"
