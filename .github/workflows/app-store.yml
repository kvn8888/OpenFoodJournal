name: App Store Promotion

on:
  push:
    branches:
      - app-store
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: Submit the staged build to App Review after strict validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: openfoodjournal-app-store-promotion
  cancel-in-progress: false

jobs:
  cloud-ci:
    name: Validate branch
    uses: ./.github/workflows/cloud-ci.yml

  prepare:
    name: Prepare reviewed promotion plan
    needs: cloud-ci
    if: vars.ENABLE_APP_STORE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    outputs:
      build_id: ${{ steps.promotion.outputs.build_id }}
      build_number: ${{ steps.promotion.outputs.build_number }}
      tag: ${{ steps.promotion.outputs.tag }}
      version: ${{ steps.promotion.outputs.version }}
      store_metadata_source: ${{ steps.store_metadata.outputs.source }}

    steps:
      - name: Check out App Store source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tested TestFlight manifest
        id: promotion
        run: |
          tag_prefix="$(jq -r '.testFlightTagPrefix' ci/release-config.json)"
          testflight_tag="$(
            git tag --merged HEAD --list "${tag_prefix}*" --sort=-creatordate |
              head -n 1
          )"
          if [[ -z "${testflight_tag}" ]]; then
            echo "No tested TestFlight prerelease is reachable from app-store HEAD." >&2
            exit 1
          fi

          manifest_dir="${RUNNER_TEMP}/promotion-manifest"
          mkdir -p "${manifest_dir}"
          gh release download "${testflight_tag}" \
            --pattern 'release-manifest.json' \
            --pattern 'whats-new.txt' \
            --dir "${manifest_dir}"
          manifest_path="${manifest_dir}/release-manifest.json"
          whats_new_path="${manifest_dir}/whats-new.txt"
          bash .github/scripts/verify-promotion.sh \
            "${testflight_tag}" \
            "${manifest_path}" \
            "${whats_new_path}"

          printf 'build_id=%s\n' "$(jq -r '.buildID' "${manifest_path}")" >> "${GITHUB_OUTPUT}"
          printf 'build_number=%s\n' "$(jq -r '.buildNumber' "${manifest_path}")" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${testflight_tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "$(jq -r '.version' "${manifest_path}")" >> "${GITHUB_OUTPUT}"

      - name: Collect product-page evidence
        run: |
          locale="$(jq -r '.primaryLocale' ci/release-config.json)"

          # The reviewed What's New already describes this release in
          # user-facing terms and was validated before the TestFlight tag was
          # cut, so it is the evidence of record for the rest of the page.
          cp "${RUNNER_TEMP}/promotion-manifest/whats-new.txt" \
            "${RUNNER_TEMP}/store-evidence.txt"

          # `asc metadata pull` writes this tree. Without a committed snapshot
          # the generator writes fresh copy rather than editing what is live,
          # so the approval summary calls that case out explicitly.
          : > "${RUNNER_TEMP}/store-current-description.txt"
          current="metadata/version/${{ steps.promotion.outputs.version }}/${locale}.json"
          if [[ ! -f "${current}" ]]; then
            latest="$(ls -1d metadata/version/*/ 2>/dev/null | sort -V | tail -n 1)"
            [[ -n "${latest}" ]] && current="${latest}${locale}.json"
          fi
          if [[ -f "${current}" ]]; then
            jq -r '.description // ""' "${current}" \
              > "${RUNNER_TEMP}/store-current-description.txt"
          fi

      - name: Draft product-page copy with the agentic harness
        if: env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@cf44f7fa4886f7aea5dae9774caef8ae6ccebf81 # v1.0.211
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Grep,Glob,Write"'
          prompt: |
            Write the App Store product page copy for OpenFoodJournal ${{ steps.promotion.outputs.version }}.

            Read these first, in order:
              1. ci/prompts/store-metadata-system.txt - the rules you must follow
              2. ${{ runner.temp }}/store-evidence.txt - what actually ships in this version
              3. ${{ runner.temp }}/store-current-description.txt - the current page, may be empty
              4. The repository itself, to check that every claim you make is supported by code

            You have the repository, so verify rather than assume: if you want to
            claim a capability, find it in the source first. Drop any claim you
            cannot ground. Do not describe anything gated behind a Debug build.

            Write the result to ${{ runner.temp }}/store-metadata.agent.json as a
            single JSON object with exactly the keys description, keywords and
            promotionalText, obeying every limit in the rules file. Write nothing
            else, create no branch, and open no pull request.

      - name: Resolve App Store product-page copy
        id: store_metadata
        env:
          BIFROST_BASE_URL: ${{ vars.BIFROST_BASE_URL }}
          BIFROST_VIRTUAL_KEY: ${{ secrets.BIFROST_VIRTUAL_KEY }}
          BIFROST_AUTHORIZATION: ${{ secrets.BIFROST_AUTHORIZATION }}
          STORE_METADATA_AGENT_MODEL: ${{ vars.STORE_METADATA_AGENT_MODEL }}
        run: |
          model="${{ vars.STORE_METADATA_MODEL }}"
          if [[ -z "${model}" ]]; then
            model="$(jq -r '.storeMetadataModel' ci/release-config.json)"
          fi

          bash .github/scripts/generate-store-metadata.sh \
            "${{ steps.promotion.outputs.version }}" \
            "$(jq -r '.primaryLocale' ci/release-config.json)" \
            "${RUNNER_TEMP}/store-evidence.txt" \
            "${RUNNER_TEMP}/store-current-description.txt" \
            "${RUNNER_TEMP}/store-metadata.agent.json" \
            "${RUNNER_TEMP}/promotion-manifest/store-metadata.json" \
            "${RUNNER_TEMP}/promotion-manifest/store-metadata-source.json" \
            "${model}" >> "${GITHUB_OUTPUT}"

      - name: Retain the immutable promotion plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-promotion-plan
          path: ${{ runner.temp }}/promotion-manifest
          retention-days: 14

      - name: Write approval summary
        run: |
          manifest="${RUNNER_TEMP}/promotion-manifest/release-manifest.json"
          {
            echo "## App Store promotion awaiting approval"
            echo
            echo "- Version: ${{ steps.promotion.outputs.version }}"
            echo "- Build: ${{ steps.promotion.outputs.build_number }}"
            echo "- Tested manifest: \`${{ steps.promotion.outputs.tag }}\`"
            echo "- Exact TestFlight binary: yes; no rebuild"
            echo "- Requested action: ${{ inputs.submit_for_review == true && 'stage, validate, and submit to App Review' || 'stage and validate only' }}"
            echo "- Release-note source: \`$(jq -r '.releaseNotes.source' "${manifest}")\`"
            echo "- Product-page source: \`${{ steps.store_metadata.outputs.source }}\`"
            echo
            store="${RUNNER_TEMP}/promotion-manifest/store-metadata.json"
            if [[ -s "${store}" ]]; then
              if [[ ! -s "${RUNNER_TEMP}/store-current-description.txt" ]]; then
                echo "> No committed \`metadata/\` snapshot was available, so this copy"
                echo "> was written fresh rather than edited from the live page."
                echo
              fi
              echo "### Proposed product page (${{ steps.promotion.outputs.version }})"
              echo
              echo "**Promotional text**"
              echo
              jq -r '.promotionalText' "${store}"
              echo
              echo "**Keywords**"
              echo
              printf '\`%s\`\n' "$(jq -r '.keywords' "${store}")"
              echo
              echo "**Description**"
              echo
              jq -r '.description' "${store}"
              echo
            else
              echo "### Product page"
              echo
              echo "No copy was generated; the live App Store text is kept as-is."
              echo
            fi
            echo "### Reviewed What's New (${{ steps.promotion.outputs.version }})"
            echo
            cat "${RUNNER_TEMP}/promotion-manifest/whats-new.txt"
            echo
            echo
            echo "Approve the protected \`app-store-production\` environment only if this exact build and text are ready."
          } >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote tested build
    needs:
      - cloud-ci
      - prepare
    if: vars.ENABLE_APP_STORE_AUTOMATION == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: app-store-production
    permissions:
      contents: write

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out approved App Store source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download approved promotion plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-store-promotion-plan
          path: ${{ runner.temp }}/promotion-manifest

      - name: Reverify approved provenance and notes
        run: |
          bash .github/scripts/verify-promotion.sh \
            "${{ needs.prepare.outputs.tag }}" \
            "${RUNNER_TEMP}/promotion-manifest/release-manifest.json" \
            "${RUNNER_TEMP}/promotion-manifest/whats-new.txt"

      - name: Reverify approved product-page copy
        run: |
          store="${RUNNER_TEMP}/promotion-manifest/store-metadata.json"
          if [[ -s "${store}" ]]; then
            bash .github/scripts/validate-store-metadata.sh "${store}"
          else
            echo "No generated product-page copy in the approved plan; keeping the live text."
          fi

      - name: Verify pinned Xcode toolchain
        run: bash .github/scripts/verify-xcode.sh

      - name: Install pinned App Store Connect CLI
        run: bash .github/scripts/install-asc.sh

      - name: Confirm build remains valid in App Store Connect
        run: |
          asc builds info \
            --build-id "${{ needs.prepare.outputs.build_id }}" \
            --output json \
            --pretty > "${RUNNER_TEMP}/build-info.json"
          processing_state="$(jq -r '.data.attributes.processingState // .attributes.processingState // empty' "${RUNNER_TEMP}/build-info.json")"
          if [[ "${processing_state}" != "VALID" ]]; then
            echo "Build processing state is ${processing_state:-unknown}, not VALID." >&2
            exit 1
          fi

      - name: Find the current public version
        id: public_version
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          versions_json="$(asc versions list --app "${app_id}" --platform IOS --output json)"
          source_version="$(
            jq -r '
              [
                .data[]
                | select(
                    .attributes.appStoreState == "READY_FOR_SALE"
                    or .attributes.appVersionState == "READY_FOR_DISTRIBUTION"
                  )
              ]
              | sort_by(.attributes.createdDate)
              | last
              | .attributes.versionString // empty
            ' <<< "${versions_json}"
          )"
          if [[ -z "${source_version}" ]]; then
            echo "No public App Store version is available as the metadata source." >&2
            exit 1
          fi
          printf 'version=%s\n' "${source_version}" >> "${GITHUB_OUTPUT}"

      - name: Stage exact TestFlight build for the App Store
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"

          # release stage performs its own readiness validation. Copy the
          # complete public localization as a temporary valid baseline so a
          # newly created version is not rejected for an empty What's New or
          # description before the next step can apply the reviewed manifest.
          # The reviewed fields are pushed immediately afterward, followed by
          # the workflow's strict validation gate.
          asc release stage \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build "${{ needs.prepare.outputs.build_id }}" \
            --copy-metadata-from "${{ steps.public_version.outputs.version }}" \
            --checkpoint-file "${RUNNER_TEMP}/app-store-stage-checkpoint.json" \
            --confirm \
            --output json \
            --pretty > "${RUNNER_TEMP}/app-store-stage.json"

      - name: Apply reviewed release notes from the manifest
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          manifest="${RUNNER_TEMP}/promotion-manifest/release-manifest.json"
          locale="$(jq -r '.primaryLocale' "${manifest}")"
          metadata_dir="${RUNNER_TEMP}/metadata"
          metadata_file="${metadata_dir}/version/${{ needs.prepare.outputs.version }}/${locale}.json"
          mkdir -p "$(dirname "${metadata_file}")"
          store="${RUNNER_TEMP}/promotion-manifest/store-metadata.json"
          if [[ -s "${store}" ]]; then
            jq -s '{whatsNew: .[0].whatsNew} + .[1]' "${manifest}" "${store}" \
              > "${metadata_file}"
          else
            jq '{whatsNew: .whatsNew}' "${manifest}" > "${metadata_file}"
          fi
          asc metadata validate --dir "${metadata_dir}" --output json
          asc metadata push \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --platform IOS \
            --dir "${metadata_dir}" \
            --output json \
            --pretty > "${RUNNER_TEMP}/metadata-push.json"

      - name: Run strict submission readiness checks
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          asc validate \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --platform IOS \
            --strict \
            --output json \
            --pretty > "${RUNNER_TEMP}/app-store-validation.json"

      - name: Prepare the exact GitHub release draft
        run: |
          bash .github/scripts/prepare-github-app-store-release.sh \
            "${RUNNER_TEMP}/promotion-manifest/release-manifest.json" \
            "${RUNNER_TEMP}/promotion-manifest/whats-new.txt"

      - name: Submit to App Review
        if: inputs.submit_for_review == true
        run: |
          app_id="$(jq -r '.appStoreAppID' ci/release-config.json)"
          asc review submit \
            --app "${app_id}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build "${{ needs.prepare.outputs.build_id }}" \
            --confirm \
            --output json \
            --pretty > "${RUNNER_TEMP}/app-review-submission.json"

      - name: Write promotion summary
        run: |
          {
            echo "## App Store promotion"
            echo
            echo "- Version: ${{ needs.prepare.outputs.version }}"
            echo "- Build: ${{ needs.prepare.outputs.build_number }}"
            echo "- Tested manifest: \`${{ needs.prepare.outputs.tag }}\`"
            echo "- Rebuilt: no; exact TestFlight build promoted"
            echo "- Product-page source: \`${{ needs.prepare.outputs.store_metadata_source }}\`"
            echo "- Submitted for review: ${{ inputs.submit_for_review || false }}"
          } >> "${GITHUB_STEP_SUMMARY}"
